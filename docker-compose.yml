services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/data
      # Shadow-mount private files out of the container even though the bind mount above covers
      # the whole repo — belt-and-suspenders alongside .dockerignore, since .dockerignore only
      # affects the build context, not runtime bind mounts. See TODO.md security fix entry.
      - /dev/null:/data/CLAUDE.md:ro
      - /data/docs/claude-web-design
    restart: unless-stopped

  audio_app:
    build: .
    container_name: consultbae-audio-app
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
      - /dev/null:/app/CLAUDE.md:ro
      - /app/docs/claude-web-design
    restart: unless-stopped

volumes:
  n8n_data:
    external: true
