services:
  # One-off: builds consultbae.db from the source CSVs. Needs the full repo (to read
  # docs/assignment-files and write the db back to the repo root), unlike the two services below.
  # Never runs as part of `up` — profiles keeps it out of that — only via:
  #   docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["tools"]
    volumes:
      - .:/app
    command: ["python", "ingest/ingest.py"]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Directory mount, not a single-file mount — single-file bind mounts are unreliable on
      # Docker Desktop for Windows. consultbae.db lives inside ./data, so the SQLite credential's
      # path stays /data/consultbae.db either way.
      - ./data:/data
    restart: unless-stopped

  audio_app:
    build: .
    container_name: consultbae-audio-app
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  n8n_data:
    external: true
